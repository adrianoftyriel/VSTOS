name: ISO

# Building the installer means downloading a 3 GB Ubuntu image and writing another
# one out, so it does not run on every push. Tag a release, or start it by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ubuntu_release:
        description: Ubuntu point release to build on
        default: "24.04.3"
      fbk_release:
        description: FBKSuppressor tag to pin (blank means the newest)
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build the installer ISO
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso

      # The base ISO plus the one being written is about 6 GB, and a GitHub runner
      # does not have much more than that free once its preinstalled toolchains are
      # accounted for.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Build
        env:
          UBUNTU_RELEASE: ${{ inputs.ubuntu_release || '24.04.3' }}
          FBK_RELEASE: ${{ inputs.fbk_release }}
        run: |
          ./build/build-iso.sh \
            --branch "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
            --out "${GITHUB_WORKSPACE}/vstos-installer.iso"

      - name: Checksum
        run: sha256sum vstos-installer.iso | tee vstos-installer.iso.sha256

      # The ISO is NOT attached to the release: a GitHub release asset is capped
      # at 2 GB and an Ubuntu-based installer image is comfortably past it, so the
      # upload would fail rather than merely being large. The image goes to a
      # workflow artifact, which has no such per-file cap, and the release carries
      # its checksum plus the one command that rebuilds it.
      - uses: actions/upload-artifact@v4
        with:
          name: vstos-installer-iso
          path: vstos-installer.iso
          retention-days: 14
          compression-level: 0   # an ISO is already compressed; zipping it again buys nothing
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: vstos-installer-iso-checksum
          path: vstos-installer.iso.sha256
          if-no-files-found: error

      - name: Attach the checksum to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The release itself is created by the CI workflow's publish job; this
          # only adds the ISO checksum to it, and waits for it to exist rather
          # than racing it.
          for _ in $(seq 1 30); do
            gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "${GITHUB_REF_NAME}" vstos-installer.iso.sha256 --clobber
          gh release view "${GITHUB_REF_NAME}" --json body --jq .body > existing-notes.md
          cat existing-notes.md build/iso-release-note.md > combined-notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file combined-notes.md

  # ---------------------------------------------------------------------------
  # The live image - the one people actually boot.
  #
  # Built here as well as locally because building it needs root, chroot,
  # overlayfs and loop-mounted squashfs: a Linux machine, and a fairly permissive
  # one. Someone on Windows or macOS has no way to produce this themselves, and
  # writing a downloaded image to a stick is something every platform can do. So
  # CI builds it and they download it.
  live:
    name: Build the live USB image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools rsync isolinux

      # The base ISO, the unpacked root filesystem, the rebuilt squashfs and the
      # output image all coexist for part of the run.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Build
        env:
          UBUNTU_RELEASE: ${{ inputs.ubuntu_release || '24.04.4' }}
          FBK_RELEASE: ${{ inputs.fbk_release }}
          # FBKSuppressor lives in another repository; without a token that can
          # read it the plugin is left out and the builder says so rather than
          # shipping a quietly incomplete image.
          GITHUB_TOKEN: ${{ secrets.FBK_READ_TOKEN || github.token }}
        run: sudo -E ./build/build-live-iso.sh --out "${GITHUB_WORKSPACE}/vstos-live.iso"

      - name: Checksum
        run: sha256sum vstos-live.iso | tee vstos-live.iso.sha256

      # A workflow artifact, not a release asset: release assets are capped at
      # 2 GB and this image is comfortably past that.
      - uses: actions/upload-artifact@v4
        with:
          name: vstos-live-iso
          path: vstos-live.iso
          retention-days: 14
          compression-level: 0   # an ISO is already compressed
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: vstos-live-iso-checksum
          path: vstos-live.iso.sha256
          if-no-files-found: error
