# Kernel tuning for a realtime audio appliance.

# Swapping an audio process is never the right trade. Not zero: the kernel should
# still be able to evict genuinely cold pages under pressure rather than starting
# to kill things.
vm.swappiness = 10

# Realtime throttling: the kernel's guarantee that a runaway realtime thread
# cannot lock the machine out entirely. The default reserves 5% of each period for
# non-realtime work; 1% is enough to keep a shell responsive while giving the
# engine more of the CPU.
#
# The obvious move here is kernel.sched_rt_runtime_us = -1, which disables the
# throttle. It is not done, deliberately: with it off, a plugin that spins in its
# process callback takes the machine with it and the only way back is the power
# switch. On a box at the back of a venue that is the difference between a bad
# sound and a dead PA.
kernel.sched_rt_runtime_us = 990000

# Plugin scanning walks a lot of directories.
fs.inotify.max_user_watches = 524288
