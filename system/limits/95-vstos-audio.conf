# Realtime privileges for the audio group.
#
# These three lines are what separates an audio machine from a general purpose
# one. Without them the engine runs at normal priority: it will mostly work, and
# then it will drop a period because something else wanted the CPU, and the
# dropout will happen during the one moment of the service that everybody is
# listening to.
#
# rtprio 95 is the ceiling, not the setting. JACK_RT_PRIORITY in
# /etc/vstos/vstos.conf picks the actual value (80 by default), leaving headroom
# above it for the kernel's own threaded IRQ handlers, which must be able to
# preempt audio processing to deliver the USB packets that audio processing is
# waiting for. Setting the engine to 95 inverts that and makes latency worse.
@audio   -   rtprio      95

# Locked memory cannot be paged out. A page fault inside the process callback is
# a disk seek in the middle of a 2.7 ms budget.
@audio   -   memlock     unlimited

# Negative nice for the non-realtime helper threads.
@audio   -   nice        -19
